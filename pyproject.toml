[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage-agent"
version = "0.1.0"
description = "AI-Powered Customer Support Triage Agent"
requires-python = ">=3.12"
authors = [{ name = "Support Triage Team" }]

[tool.uv]
package = false
workspace = { members = [
    "packages/py_core",
    "services/api",
    "services/triage_worker",
    "services/knowledge_worker",
    "ml/evals",
] }

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "packages/py_core/tests", "services/triage_worker/tests", "services/knowledge_worker/tests", "tests", "ml/evals/tests"]
python_files = "test_*.py"
addopts = "--import-mode=importlib -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services (docker/testcontainers)",
    "acceptance: end-to-end acceptance scenarios",
    "eval: ML evaluation tests",
    "slow: long-running tests",
    "bdd: Gherkin BDD scenarios",
]

[tool.uv.sources]
py-core = { workspace = true }
api = { workspace = true }
triage-worker = { workspace = true }
knowledge-worker = { workspace = true }
evals = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-bdd>=6.1",
    "mypy>=1.7",
    "ruff==0.17.0",
    "black>=23.0",
    "factory-boy>=3.3",
    "testcontainers[postgres,redis]>=3.7",
]
test = [
    "testcontainers[postgres,redis]>=3.7",
    "pytest-asyncio>=0.21",
    "pytest-recording>=0.13",
    "vcrpy>=4.4",
]
