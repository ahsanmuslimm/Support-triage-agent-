[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "FastAPI application for Triage Agent"
requires-python = "^3.12"
authors = [{ name = "Support Triage Team" }]
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "py-core @ file:///../py_core",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
