[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "FastAPI application for Triage Agent"
requires-python = "^3.12"
authors = [{ name = "Support Triage Team" }]
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "py-core @ file:///../py_core",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.0",
    "cryptography>=41.0",
    "langdetect>=1.0.9",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    "redis>=5.0",
    "alembic>=1.12",
    "psycopg[binary]>=3.1",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "structlog>=23.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "litellm>=1.30.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.9.0",
    "tiktoken>=0.7.0",
    "transformers>=4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "testcontainers>=3.7",
    "faker>=20.0",
    "hypothesis>=6.80",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["triage"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
