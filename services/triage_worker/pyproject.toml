[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage-worker"
version = "0.1.0"
description = "LangGraph worker for triage logic"
requires-python = ">=3.12"
authors = [{ name = "Support Triage Team" }]
dependencies = [
    "py-core",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/triage_worker"]
