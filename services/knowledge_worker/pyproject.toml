[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-worker"
version = "0.1.0"
description = "Knowledge indexing and retrieval service"
requires-python = ">=3.12"
authors = [{ name = "Support Triage Team" }]
dependencies = [
    "py-core",
    "api",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "structlog>=23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_worker"]
