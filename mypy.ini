[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
disallow_any_generics = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_calls = True
disallow_untyped_defs = True

plugins = 
    pydantic.mypy

[mypy-py_core.testing.factories]
# Optional factory_boy import with dict fallback; not expressible under --strict.
ignore_errors = True

[mypy-tests.*]
ignore_errors = False

[mypy-testcontainers.*]
ignore_missing_imports = True

[mypy-factory.*]
ignore_missing_imports = True

[mypy-vcr.*]
ignore_missing_imports = True
